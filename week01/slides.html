<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 1 — Welcome to Machine Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14294a; --navy2:#1f3c66; --ink:#1c2533; --muted:#5b6678; --line:#dfe4ec; --bg:#eef1f6; --paper:#ffffff;
  --teal:#0f8b80; --teal-l:#e3f4f2; --coral:#d9573b; --coral-l:#fbe9e4; --amber:#c98a12; --amber-l:#fbf2dc;
  --blue:#2f6fd0; --blue-l:#e6eefb; --violet:#6a4fc8; --violet-l:#efebfb; --green:#2e8b4f; --green-l:#e5f4ea;
  --sec:#0f8b80; --sec-l:#e3f4f2;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1424;font-family:var(--font);color:var(--ink);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--paper);display:none;flex-direction:column;overflow:hidden;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.slide.active{display:flex;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.s-band{height:8px;background:linear-gradient(90deg,var(--sec),var(--navy2))}
.s-head{padding:26px 64px 10px 64px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.kicker{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--sec)}
.kicker .dot{width:10px;height:10px;border-radius:50%;background:var(--sec)}
.s-head h2{margin:8px 0 0;font-size:42px;line-height:1.12;color:var(--navy);font-weight:800;letter-spacing:-.01em}
.s-head .tag{font-size:15px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--sec-l);color:var(--sec);white-space:nowrap}
.s-body{flex:1;padding:14px 64px 10px 64px;font-size:22px;line-height:1.48;overflow:hidden;position:relative}
.s-foot{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.s-foot b{color:var(--navy)}
/* typography helpers */
.s-body p{margin:0 0 12px}
.s-body ul.b{margin:0;padding:0;list-style:none}
.s-body ul.b>li{position:relative;padding-left:30px;margin:0 0 12px}
.s-body ul.b>li:before{content:"";position:absolute;left:4px;top:.55em;width:11px;height:11px;border-radius:3px;background:var(--sec);transform:rotate(45deg)}
.s-body ul.b.tight>li{margin-bottom:8px}
.s-body ol.n{margin:0;padding-left:28px}.s-body ol.n>li{margin:0 0 10px;padding-left:6px}
.sm{font-size:19px;line-height:1.45}.xs{font-size:16.5px;line-height:1.42}.lg{font-size:25px}
.muted{color:var(--muted)} b,strong{color:var(--navy)} .hl{background:linear-gradient(transparent 58%,#ffe28a 58%)}
.cols{display:grid;gap:30px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c4{grid-template-columns:repeat(4,1fr)}
.c64{grid-template-columns:1.5fr 1fr}.c46{grid-template-columns:1fr 1.5fr}.c73{grid-template-columns:1.9fr 1fr}.c37{grid-template-columns:1fr 1.9fr}
.card{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.card h3,.panel h3{margin:0 0 8px;font-size:22px;color:var(--navy)}
.card.t{background:var(--teal-l);border-color:#bfe5e0}.card.c{background:var(--coral-l);border-color:#f3cdc2}.card.a{background:var(--amber-l);border-color:#f0dca8}
.card.bl{background:var(--blue-l);border-color:#c8d9f5}.card.v{background:var(--violet-l);border-color:#d8cff3}.card.g{background:var(--green-l);border-color:#c5e4cf}
.card .ic{font-size:30px;line-height:1;margin-bottom:8px}
.callout{border-left:6px solid var(--sec);background:var(--sec-l);padding:14px 20px;border-radius:0 12px 12px 0;margin-top:14px}
.callout.warn{border-color:var(--coral);background:var(--coral-l)}.callout.gold{border-color:var(--amber);background:var(--amber-l)}
.callout b{color:inherit}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:15px;font-weight:700;background:var(--sec-l);color:var(--sec);margin-right:6px}
.pill.c{background:var(--coral-l);color:var(--coral)}.pill.a{background:var(--amber-l);color:var(--amber)}.pill.bl{background:var(--blue-l);color:var(--blue)}.pill.v{background:var(--violet-l);color:var(--violet)}.pill.g{background:var(--green-l);color:var(--green)}
table.t{border-collapse:collapse;width:100%;font-size:18px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600}
table.t td{border-bottom:1px solid var(--line);padding:8px 12px;vertical-align:top}
table.t tr:nth-child(even) td{background:#f7f9fc}
table.t.mono td{font-family:var(--mono);font-size:16px}
th.feat{background:var(--blue)!important} th.lab{background:var(--coral)!important}
kbd{font-family:var(--mono);font-size:.8em;background:#eef1f6;border:1px solid #c9d1de;border-bottom-width:3px;border-radius:6px;padding:1px 7px}
code{font-family:var(--mono);font-size:.86em;background:#eef2f8;padding:1px 6px;border-radius:5px;color:#20406e}
pre.code{margin:0;background:#0f1b2d;color:#dbe6f5;border-radius:14px;padding:18px 22px;font-family:var(--mono);font-size:16.5px;line-height:1.55;overflow:hidden;position:relative;white-space:pre}
pre.code .k{color:#ff9fb1}pre.code .s{color:#a7e3a1}pre.code .c{color:#7f93ae;font-style:italic}pre.code .n{color:#ffd38a}pre.code .f{color:#8cc8ff}
pre.code .copy{position:absolute;top:10px;right:10px;font-family:var(--font);font-size:13px;background:#24364f;color:#cfe0f5;border:0;border-radius:8px;padding:5px 10px;cursor:pointer}
a{color:var(--blue);text-decoration:none;font-weight:600} a:hover{text-decoration:underline}
/* buttons */
.btn{font-family:var(--font);font-size:17px;font-weight:600;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--navy);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.15)} .btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)} .btn.teal{background:var(--teal)} .btn.coral{background:var(--coral)}
.btn.sm{font-size:15px;padding:6px 12px}
/* activity */
.act-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.timer{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--navy);background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.timer .tv{font-family:var(--mono);min-width:64px}
.timer.done{border-color:var(--coral);color:var(--coral)}
.solution{display:none;margin-top:12px;border:2px dashed var(--teal);background:#f3fbfa;border-radius:12px;padding:14px 18px}
.solution.show{display:block;animation:fadein .3s}
/* flip cards */
.flipgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.flip{perspective:900px;height:150px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fr,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.flip .fr{background:#f7f9fc;border:2px solid var(--line);font-weight:700;font-size:20px;color:var(--navy);text-align:center;align-items:center}
.flip .fr small{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:6px}
.flip .bk{transform:rotateY(180deg);font-size:15.5px;line-height:1.35}
.flip .bk.yes{background:var(--teal-l);border:2px solid var(--teal)} .flip .bk.no{background:var(--coral-l);border:2px solid var(--coral)}
.flip .bk b{font-size:18px}
/* quiz */
.q{margin-bottom:12px}
.q .qt{font-weight:600;color:var(--navy);margin-bottom:6px}
.q .opts{display:flex;flex-wrap:wrap;gap:8px}
.q .opt{font-family:var(--font);font-size:17px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;color:var(--ink)}
.q .opt:hover{border-color:var(--navy2)}
.q .opt.right{border-color:var(--teal);background:var(--teal-l);color:#075e56;font-weight:700}
.q .opt.wrong{border-color:var(--coral);background:var(--coral-l);color:#8f2d18;text-decoration:line-through}
.q .why{display:none;font-size:16.5px;margin-top:6px;color:#2c3a4f;background:#f7f9fc;border-left:4px solid var(--teal);padding:6px 12px;border-radius:0 8px 8px 0}
.q.done .why{display:block}
.score{font-weight:700;color:var(--teal)}
/* tabs */
.tabs .tab-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tabs .tab-btn{font-family:var(--font);font-size:17px;font-weight:600;padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--navy)}
.tabs .tab-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs .tab-panel{display:none}.tabs .tab-panel.on{display:block;animation:fadein .3s}
/* stepper */
.steps{display:flex;gap:8px;margin-bottom:16px}
.steps .st{flex:1;text-align:center;cursor:pointer;padding:12px 6px;border-radius:12px;background:#f2f5fa;border:2px solid var(--line);font-weight:700;font-size:17px;color:var(--navy);position:relative}
.steps .st .num{display:block;width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--navy);color:#fff;margin:0 auto 6px;font-size:16px}
.steps .st.on{background:var(--sec-l);border-color:var(--sec)} .steps .st.on .num{background:var(--sec)}
/* timeline */
.tl{display:flex;justify-content:space-between;position:relative;margin:6px 0 18px}
.tl:before{content:"";position:absolute;left:0;right:0;top:20px;height:4px;background:var(--line)}
.tl .tp{position:relative;text-align:center;cursor:pointer;flex:1}
.tl .tp .d{width:40px;height:40px;border-radius:50%;background:#fff;border:4px solid var(--navy2);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--navy)}
.tl .tp.on .d{background:var(--sec);border-color:var(--sec);color:#fff}
.tl .tp .y{font-weight:800;color:var(--navy);font-size:17px}.tl .tp .l{font-size:14px;color:var(--muted)}
/* widget misc */
.wbox{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:16px}
input[type=range]{width:100%;accent-color:var(--teal)}
.big{font-size:44px;font-weight:800;color:var(--navy);font-family:var(--mono)}
.meter{height:16px;border-radius:99px;background:#e6eaf1;overflow:hidden}.meter>i{display:block;height:100%;background:var(--teal);transition:width .3s}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:18px}.bar .lbl{width:120px;font-family:var(--mono);text-align:right}.bar .trk{flex:1;height:26px;background:#e8ecf3;border-radius:6px;overflow:hidden}.bar .trk i{display:block;height:100%;background:var(--violet);transition:width .4s}.bar .pc{width:60px;font-family:var(--mono);font-size:16px}
.people{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}.people i{display:block;aspect-ratio:1/1.2;border-radius:40% 40% 20% 20%;background:#c9d3e2}.people i.pos{background:var(--coral)}
textarea.msg,input.msg{width:100%;font-family:var(--font);font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;resize:none}
.verdict{font-weight:800;font-size:22px}.verdict.spam{color:var(--coral)}.verdict.ham{color:var(--teal)}
.chip{display:inline-block;font-size:15px;padding:4px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);margin:3px 4px 3px 0;cursor:pointer}
.chip:hover{border-color:var(--navy2)}
.fb{font-weight:700;min-height:28px}.fb.ok{color:var(--teal)}.fb.bad{color:var(--coral)}
/* title slide */
.slide.title{background:radial-gradient(1200px 700px at 85% 15%,#24508c 0%,transparent 60%),linear-gradient(135deg,#0d1d36,#14294a 55%,#103a49);color:#fff}
.slide.title .tbody{flex:1;padding:90px 110px 40px;display:flex;flex-direction:column;justify-content:center}
.slide.title .eyebrow{font-size:18px;letter-spacing:.18em;text-transform:uppercase;color:#7fd8cd;font-weight:700}
.slide.title h1{font-size:76px;line-height:1.04;margin:18px 0 14px;font-weight:800;letter-spacing:-.02em}
.slide.title .sub{font-size:30px;color:#c9d7ec;max-width:880px;line-height:1.35}
.slide.title .meta{margin-top:46px;display:flex;gap:40px;font-size:19px;color:#b9c8de}
.slide.title .meta b{color:#fff;display:block;font-size:21px}
.slide.title .art{position:absolute;right:90px;bottom:80px;opacity:.9}
/* chrome */
#bar{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}#bar i{display:block;height:100%;background:#2fc3b3;width:0;transition:width .3s}
#ctrl{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:30;display:flex;gap:6px;opacity:.25;transition:opacity .2s}#ctrl:hover{opacity:1}
#ctrl button{font-family:var(--font);background:#1c2c45;color:#dfe8f5;border:1px solid #2c4060;border-radius:8px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font-size:14px}
#menu{position:fixed;top:0;left:0;bottom:0;width:380px;background:#fff;z-index:40;transform:translateX(-102%);transition:transform .25s;box-shadow:10px 0 40px rgba(0,0,0,.3);overflow:auto;padding:22px 0}
#menu.on{transform:none}
#menu h4{margin:0 22px 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#menu .sec{margin:14px 0 4px;padding:0 22px;font-weight:800;color:var(--navy);font-size:15px}
#menu a{display:block;padding:6px 22px 6px 34px;color:#2c3a4f;font-weight:500;font-size:15px}
#menu a.on{background:var(--teal-l);color:var(--teal);font-weight:700}
#ov{position:fixed;inset:0;background:#0b1424;z-index:35;overflow:auto;display:none;padding:28px}
#ov.on{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-content:start}
#ov .th{position:relative;width:100%;height:0;padding-top:56.25%;overflow:hidden;border-radius:8px;cursor:pointer;outline:3px solid transparent;background:#fff}
#ov .th.on{outline-color:#2fc3b3}
#ov .th .sc{position:absolute;top:0;left:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
#ov .th .sc .slide{display:flex!important;border-radius:0;box-shadow:none;animation:none}
#ov .th .lab{position:absolute;left:0;right:0;bottom:0;background:rgba(11,20,36,.85);color:#fff;font-size:13px;padding:5px 9px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#1c2c45;color:#e9f1fb;padding:10px 18px;border-radius:10px;font-size:15px;z-index:50;opacity:0;transition:opacity .4s;pointer-events:none}
#toast.on{opacity:1}
#help{position:fixed;inset:0;background:rgba(5,10,20,.7);z-index:60;display:none;align-items:center;justify-content:center}
#help.on{display:flex}#help .box{background:#fff;border-radius:14px;padding:26px 32px;font-size:16px;min-width:420px}
#help td{padding:5px 14px 5px 0}
@media print{
  html,body{overflow:visible;background:#fff}
  #stage{position:static;display:block}#deck{transform:none!important;width:auto;height:auto}
  .slide{display:flex!important;position:relative;width:1600px;height:900px;page-break-after:always;box-shadow:none;border-radius:0;animation:none}
  #bar,#ctrl,#menu,#ov,#toast,#help{display:none!important}
  .solution{display:block!important}
  @page{size:1600px 900px;margin:0}
}
</style>
</head>
<body>
<div id="stage"><div id="deck"></div></div>
<div id="bar"><i></i></div>
<div id="ctrl">
  <button onclick="Deck.toggleMenu()" title="Sections (M)">☰ Sections</button>
  <button onclick="Deck.toggleOverview()" title="Overview (O)">▦</button>
  
  <button onclick="Deck.prev()" title="Previous (←)">‹</button>
  <button onclick="Deck.next()" title="Next (→)">›</button>
  <button onclick="Deck.fullscreen()" title="Fullscreen (F)">⛶</button>
  <button onclick="Deck.help()" title="Help (?)">?</button>
</div>
<nav id="menu"></nav>
<div id="ov"></div>
<div id="toast"></div>
<div id="help" onclick="this.classList.remove('on')"><div class="box">
<h3 style="margin:0 0 10px;color:#14294a">Keyboard shortcuts</h3>
<table>
<tr><td><kbd>→</kbd> <kbd>Space</kbd> <kbd>PgDn</kbd></td><td>Next slide</td></tr>
<tr><td><kbd>←</kbd> <kbd>PgUp</kbd></td><td>Previous slide</td></tr>
<tr><td><kbd>Home</kbd> / <kbd>End</kbd></td><td>First / last slide</td></tr>
<tr><td><kbd>M</kbd></td><td>Section menu</td></tr>
<tr><td><kbd>O</kbd></td><td>Slide overview</td></tr>
<tr><td><kbd>F</kbd></td><td>Fullscreen</td></tr>

<tr><td><kbd>?</kbd></td><td>This help</td></tr>
</table>
<p style="color:#5b6678;margin:12px 0 0">Tip: print to PDF (Ctrl/Cmd + P) to save every slide as reading material.</p>
</div></div>

const SLIDES = [{"sec": "intro", "type": "title", "title": "Welcome to Machine Learning", "menu": "Title: Welcome to Machine Learning", "time": "2 min", "clock": "6:00", "html": "<div class=\"tbody\">\n<div class=\"eyebrow\">Introduction to Machine Learning · Week 1 of 12<\/div>\n<h1>Welcome to Machine Learning:<br>How Machines Learn from Data<\/h1>\n<div class=\"sub\">From a straight line to a tiny GPT — a hands-on, build-it-yourself course. Tonight we learn what machine learning really is, how it is organised, and we train our very first model.<\/div>\n<div class=\"meta\"><div><b>Arpan Bhavsar<\/b>Instructor<\/div><div><b>Saturday, October 3, 2026<\/b>6:00 – 9:00 pm PT · Online, live<\/div><div><b>Focus College<\/b>Fall 2026<\/div><\/div>\n<\/div><svg class=\"art\" width=\"520\" height=\"330\" viewBox=\"0 0 520 330\" fill=\"none\">\n<g opacity=\".18\" stroke=\"#9fc3ff\"><path d=\"M0 300H520M0 240H520M0 180H520M0 120H520M0 60H520\"/><path d=\"M60 0V330M160 0V330M260 0V330M360 0V330M460 0V330\"/><\/g>\n<line x1=\"20\" y1=\"300\" x2=\"500\" y2=\"40\" stroke=\"#2fc3b3\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n<g fill=\"#ffffff\"><circle cx=\"60\" cy=\"262\" r=\"9\"/><circle cx=\"110\" cy=\"250\" r=\"9\"/><circle cx=\"150\" cy=\"222\" r=\"9\"/><circle cx=\"200\" cy=\"205\" r=\"9\"/><circle cx=\"250\" cy=\"170\" r=\"9\"/><circle cx=\"300\" cy=\"158\" r=\"9\"/><circle cx=\"350\" cy=\"120\" r=\"9\"/><circle cx=\"400\" cy=\"106\" r=\"9\"/><circle cx=\"450\" cy=\"72\" r=\"9\"/><\/g>\n<g fill=\"#ffb59f\"><circle cx=\"110\" cy=\"250\" r=\"9\"/><circle cx=\"350\" cy=\"120\" r=\"9\"/><\/g>\n<text x=\"300\" y=\"320\" fill=\"#7fd8cd\" font-family=\"JetBrains Mono, monospace\" font-size=\"20\">y = w·x + b<\/text><\/svg>"}, {"sec": "intro", "title": "Tonight's roadmap and what you will be able to do", "menu": "Roadmap and learning outcomes", "time": "4 min", "clock": "6:02", "html": "<div class=\"cols c2\">\n<div>\n<table class=\"t\">\n<tr><th>Tonight's sections<\/th><\/tr>\n<tr><td><b>Welcome<\/b> — the course journey and a live demo<\/td><\/tr>\n<tr><td><b>1. AI, ML, deep learning and generative AI<\/b><\/td><\/tr>\n<tr><td><b>2. Types of machine learning<\/b><\/td><\/tr>\n<tr><td><b>3. The ML workflow<\/b> and Guess the Line<\/td><\/tr>\n<tr><td><b>4. Identifying the type of problem<\/b><\/td><\/tr>\n<tr><td><b>5. The Python ML toolkit tour<\/b><\/td><\/tr>\n<tr><td><b>Wrap-up<\/b>, exit ticket and homework<\/td><\/tr>\n<\/table>\n<div class=\"callout gold sm\"><b>Big idea of the week:<\/b> a model is a function with adjustable knobs (parameters). Learning means turning the knobs until the model's mistakes (the loss) on real data become small.<\/div>\n<\/div>\n<div>\n<h3 style=\"margin:0 0 10px;color:var(--navy)\">By the end of tonight you will be able to…<\/h3>\n<ul class=\"b sm\">\n<li>Explain the difference between artificial intelligence, machine learning, deep learning and generative AI, and describe where tools like ChatGPT and Claude fit. <span class=\"pill\">LO1<\/span><\/li>\n<li>Classify a problem as supervised (regression or classification), unsupervised, self-supervised or reinforcement learning. <span class=\"pill\">LO1<\/span><\/li>\n<li>Describe the seven steps of the machine learning workflow and use the core vocabulary: features, labels, model, parameters, prediction and loss.<\/li>\n<li>Frame a real-world question as an ML problem and choose a success metric before building anything. <span class=\"pill\">LO4<\/span><\/li>\n<li>Name the main Python ML libraries and say when we will use each one in this course. <span class=\"pill\">LO8<\/span><\/li>\n<\/ul>\n<\/div><\/div>"}, {"sec": "intro", "title": "The course journey: from a straight line to a tiny GPT", "menu": "The course journey", "time": "5 min", "clock": "6:06", "html": "<div class=\"tabs\">\n<div class=\"tl\">\n<div class=\"tp\" data-t=\"a\"><div class=\"d\">1<\/div><div class=\"y\">Weeks 1–2<\/div><div class=\"l\">Lines & data<\/div><\/div>\n<div class=\"tp\" data-t=\"b\"><div class=\"d\">3<\/div><div class=\"y\">Weeks 3–4<\/div><div class=\"l\">Classifiers<\/div><\/div>\n<div class=\"tp\" data-t=\"c\"><div class=\"d\">5<\/div><div class=\"y\">Weeks 5–6<\/div><div class=\"l\">Unsupervised · Midterm<\/div><\/div>\n<div class=\"tp\" data-t=\"d\"><div class=\"d\">7<\/div><div class=\"y\">Weeks 7–8<\/div><div class=\"l\">Neural networks<\/div><\/div>\n<div class=\"tp\" data-t=\"e\"><div class=\"d\">9<\/div><div class=\"y\">Weeks 9–10<\/div><div class=\"l\">Deploy · Tiny GPT<\/div><\/div>\n<div class=\"tp\" data-t=\"f\"><div class=\"d\">11<\/div><div class=\"y\">Weeks 11–12<\/div><div class=\"l\">Projects · Final<\/div><\/div>\n<\/div>\n<div class=\"tab-panel sm\" data-t=\"a\"><b>Weeks 1–2:<\/b> what machine learning is, preparing data correctly, and our first real model — linear regression — trained with gradient descent that we write ourselves.<\/div>\n<div class=\"tab-panel sm\" data-t=\"b\"><b>Weeks 3–4:<\/b> models that predict categories: logistic regression, k-nearest neighbours, Naive Bayes, decision trees, random forests and support vector machines, plus how to evaluate them honestly.<\/div>\n<div class=\"tab-panel sm\" data-t=\"c\"><b>Weeks 5–6:<\/b> finding structure without labels using clustering and PCA, then the midterm exam covering Weeks 1–5.<\/div>\n<div class=\"tab-panel sm\" data-t=\"d\"><b>Weeks 7–8:<\/b> neural networks from scratch (a tiny automatic-differentiation engine inspired by Karpathy's micrograd), then PyTorch and Keras.<\/div>\n<div class=\"tab-panel sm\" data-t=\"e\"><b>Weeks 9–10:<\/b> pipelines, Spark MLlib for big data, deploying a web app with Gradio, and a tiny GPT that shows how large language models are built from the same parts.<\/div>\n<div class=\"tab-panel sm\" data-t=\"f\"><b>Weeks 11–12:<\/b> individual project presentations and the cumulative final exam.<\/div>\n<\/div>\n<div class=\"cols c3\" style=\"margin-top:6px\">\n<div class=\"card t\"><div class=\"ic\">🧩<\/div><h3>From Scratch<\/h3><p class=\"sm\">Before we use a library, we build each idea ourselves in a few lines of Python, so nothing is a black box. This strand is inspired by Andrej Karpathy's free “Neural Networks: Zero to Hero” series.<\/p><\/div>\n<div class=\"card bl\"><div class=\"ic\">🩺<\/div><h3>The Build: EarlyCheck<\/h3><p class=\"sm\">Together we build a diabetes risk screener on 253,680 real CDC survey responses, adding one layer every week until it becomes a deployed web app. It is a screening aid, never a diagnosis.<\/p><\/div>\n<div class=\"card a\"><div class=\"ic\">🧑‍💻<\/div><h3>Project Studio<\/h3><p class=\"sm\">Individually, you apply each week's ideas to a real dataset of your choice (health, finance, cancer research and more). Your weekly assignments build up step by step into your own Final Project.<\/p><\/div>\n<\/div>"}, {"sec": "intro", "title": "Live demo: teach a computer to see in two minutes", "menu": "Hook: Teachable Machine demo", "time": "5 min", "clock": "6:10", "tag": "Live demo", "html": "<div class=\"cols c64\">\n<div>\n<p>We will use <a href=\"https://teachablemachine.withgoogle.com/\" target=\"_blank\">Google Teachable Machine<\/a>, a free website that trains an image classifier inside your browser. No code and no installation are needed.<\/p>\n<ol class=\"n sm\">\n<li>Open Teachable Machine, choose <b>Get Started → Image Project → Standard image model<\/b>.<\/li>\n<li>Rename “Class 1” to <b>Mug<\/b> and “Class 2” to <b>Book<\/b>. Hold each object up to the webcam and record about 100 example images for each class.<\/li>\n<li>Click <b>Train Model<\/b>. Training takes less than a minute.<\/li>\n<li>Hold up the objects again and watch the live <b>Preview<\/b>: the model shows how confident it is in each class.<\/li>\n<li>Now try to trick it: hold up a phone, your hand, or nothing at all, and see what it predicts.<\/li>\n<\/ol>\n<\/div>\n<div>\n<div class=\"card bl\"><h3>Think about it<\/h3>\n<ul class=\"b sm tight\">\n<li>We never wrote a single rule such as “a mug has a handle”. Where did the model's knowledge come from?<\/li>\n<li>Why does the model still choose “Mug” or “Book” when you show it a phone?<\/li>\n<li>What would happen if every mug photo had a white wall behind it and every book photo had a dark wall?<\/li>\n<\/ul><\/div>\n<div class=\"callout sm\"><b>Key takeaway:<\/b> the model learned a pattern from <b>examples with labels<\/b>. It only knows the classes we gave it, and it can learn the wrong pattern if our examples are biased.<\/div>\n<\/div><\/div>"}, {"sec": "s1", "title": "What is artificial intelligence?", "menu": "What is AI?", "time": "6 min", "clock": "6:15", "html": "<div class=\"cols c46\">\n<div>\n<ul class=\"b sm\">\n<li><b>Artificial intelligence (AI)<\/b> is the broad goal of building computer systems that perform tasks we normally associate with human intelligence, such as understanding language, recognising images, making decisions and planning.<\/li>\n<li>AI is an <b>umbrella term<\/b>, not a single technique. It includes hand-written rule systems as well as systems that learn from data.<\/li>\n<li>For most of its history, AI meant <b>writing rules by hand<\/b>. Since around 2010, almost all progress has come from <b>machine learning<\/b>, where the computer finds the rules itself.<\/li>\n<\/ul>\n<div class=\"callout sm\">Today, when people say “AI”, they almost always mean a <b>machine learning model<\/b> trained on large amounts of data.<\/div>\n<\/div>\n<div class=\"tabs\">\n<div class=\"tl\">\n<div class=\"tp\" data-t=\"1950\"><div class=\"d\">50<\/div><div class=\"y\">1950<\/div><div class=\"l\">Turing<\/div><\/div>\n<div class=\"tp\" data-t=\"1956\"><div class=\"d\">56<\/div><div class=\"y\">1956<\/div><div class=\"l\">“AI” named<\/div><\/div>\n<div class=\"tp\" data-t=\"1959\"><div class=\"d\">59<\/div><div class=\"y\">1959<\/div><div class=\"l\">Samuel<\/div><\/div>\n<div class=\"tp\" data-t=\"1980\"><div class=\"d\">80s<\/div><div class=\"y\">1980s<\/div><div class=\"l\">Expert systems<\/div><\/div>\n<div class=\"tp\" data-t=\"2012\"><div class=\"d\">12<\/div><div class=\"y\">2012<\/div><div class=\"l\">Deep learning<\/div><\/div>\n<div class=\"tp\" data-t=\"2017\"><div class=\"d\">17<\/div><div class=\"y\">2017<\/div><div class=\"l\">Transformer<\/div><\/div>\n<div class=\"tp\" data-t=\"2022\"><div class=\"d\">22<\/div><div class=\"y\">2022<\/div><div class=\"l\">ChatGPT<\/div><\/div>\n<\/div>\n<div class=\"card tab-panel sm\" data-t=\"1950\"><b>1950 — Alan Turing<\/b> publishes “Computing Machinery and Intelligence” and asks “Can machines think?”, proposing the imitation game now called the Turing test.<\/div>\n<div class=\"card tab-panel sm\" data-t=\"1956\"><b>1956 — The Dartmouth workshop.<\/b> John McCarthy and colleagues use the name “artificial intelligence” for a summer research project, and AI becomes a field.<\/div>\n<div class=\"card tab-panel sm\" data-t=\"1959\"><b>1959 — Arthur Samuel<\/b> at IBM publishes his work on a checkers program that improved by playing against itself, and popularises the term “machine learning”.<\/div>\n<div class=\"card tab-panel sm\" data-t=\"1980\"><b>1980s — Expert systems.<\/b> Companies encode the knowledge of human experts as thousands of if-then rules. They work in narrow areas but are expensive to build and break easily.<\/div>\n<div class=\"card tab-panel sm\" data-t=\"2012\"><b>2012 — AlexNet<\/b>, a deep neural network trained on GPUs, wins the ImageNet image-recognition competition by a large margin and starts the deep learning boom.<\/div>\n<div class=\"card tab-panel sm\" data-t=\"2017\"><b>2017 — “Attention Is All You Need.”<\/b> Google researchers introduce the Transformer architecture, the “T” in GPT and the basis of today's large language models.<\/div>\n<div class=\"card tab-panel sm\" data-t=\"2022\"><b>November 2022 — ChatGPT<\/b> is released and reaches millions of users within days, bringing generative AI into everyday life. Claude, Gemini and others follow.<\/div>\n<p class=\"xs muted\" style=\"margin-top:10px\">Click a point on the timeline to read about it.<\/p>\n<\/div><\/div>"}, {"sec": "s1", "title": "What is machine learning?", "menu": "What is ML?", "time": "6 min", "clock": "6:20", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li><b>Machine learning (ML)<\/b> is the part of AI in which a computer <b>learns patterns from data<\/b> instead of following rules a programmer wrote by hand.<\/li>\n<li>Arthur Samuel's idea (1959) is often summarised as giving computers “the ability to learn without being explicitly programmed”.<\/li>\n<li>Tom Mitchell's more precise definition (1997): a program <b>learns<\/b> from experience <b>E<\/b> with respect to a task <b>T<\/b> and a performance measure <b>P<\/b> if its performance at T, as measured by P, improves with experience E.<\/li>\n<\/ul>\n<table class=\"t\" style=\"margin-top:10px\"><tr><th>Mitchell's terms<\/th><th>Spam filter example<\/th><\/tr>\n<tr><td><b>Task T<\/b><\/td><td>Decide whether each email is spam<\/td><\/tr>\n<tr><td><b>Experience E<\/b><\/td><td>Thousands of emails labelled spam or not spam<\/td><\/tr>\n<tr><td><b>Performance P<\/b><\/td><td>Percentage of emails classified correctly<\/td><\/tr><\/table>\n<\/div>\n<div>\n<svg viewBox=\"0 0 640 420\" width=\"100%\" style=\"max-height:430px\">\n<defs><marker id=\"ar\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#14294a\"/><\/marker><\/defs>\n<text x=\"20\" y=\"34\" font-size=\"22\" font-weight=\"800\" fill=\"#d9573b\" font-family=\"Inter\">Traditional programming<\/text>\n<rect x=\"20\" y=\"52\" width=\"150\" height=\"56\" rx=\"10\" fill=\"#fbe9e4\" stroke=\"#d9573b\"/><text x=\"95\" y=\"87\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Inter\">Rules<\/text>\n<rect x=\"20\" y=\"122\" width=\"150\" height=\"56\" rx=\"10\" fill=\"#e6eefb\" stroke=\"#2f6fd0\"/><text x=\"95\" y=\"157\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Inter\">Data<\/text>\n<rect x=\"250\" y=\"80\" width=\"150\" height=\"70\" rx=\"12\" fill=\"#14294a\"/><text x=\"325\" y=\"122\" text-anchor=\"middle\" font-size=\"20\" fill=\"#fff\" font-family=\"Inter\">Program<\/text>\n<rect x=\"470\" y=\"88\" width=\"150\" height=\"56\" rx=\"10\" fill=\"#e3f4f2\" stroke=\"#0f8b80\"/><text x=\"545\" y=\"123\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Inter\">Answers<\/text>\n<path d=\"M170 80 L248 108\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#ar)\"/><path d=\"M170 150 L248 124\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#ar)\"/><path d=\"M400 115 L466 115\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#ar)\"/>\n<text x=\"20\" y=\"250\" font-size=\"22\" font-weight=\"800\" fill=\"#0f8b80\" font-family=\"Inter\">Machine learning<\/text>\n<rect x=\"20\" y=\"268\" width=\"150\" height=\"56\" rx=\"10\" fill=\"#e6eefb\" stroke=\"#2f6fd0\"/><text x=\"95\" y=\"303\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Inter\">Data<\/text>\n<rect x=\"20\" y=\"338\" width=\"150\" height=\"56\" rx=\"10\" fill=\"#e3f4f2\" stroke=\"#0f8b80\"/><text x=\"95\" y=\"373\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Inter\">Answers<\/text>\n<rect x=\"250\" y=\"296\" width=\"150\" height=\"70\" rx=\"12\" fill=\"#14294a\"/><text x=\"325\" y=\"338\" text-anchor=\"middle\" font-size=\"20\" fill=\"#fff\" font-family=\"Inter\">Learning<\/text>\n<rect x=\"470\" y=\"304\" width=\"150\" height=\"56\" rx=\"10\" fill=\"#fbe9e4\" stroke=\"#d9573b\"/><text x=\"545\" y=\"339\" text-anchor=\"middle\" font-size=\"20\" font-family=\"Inter\">Rules (model)<\/text>\n<path d=\"M170 296 L248 324\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#ar)\"/><path d=\"M170 366 L248 340\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#ar)\"/><path d=\"M400 331 L466 331\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#ar)\"/>\n<\/svg>\n<div class=\"callout sm\">In traditional programming we give the computer <b>rules<\/b> and get answers. In machine learning we give it <b>answers (examples)<\/b> and it produces the rules — the trained <b>model<\/b>.<\/div>\n<\/div><\/div>"}, {"sec": "s1", "title": "AI, machine learning, deep learning and generative AI", "menu": "AI ⊃ ML ⊃ DL ⊃ GenAI", "time": "6 min", "clock": "6:25", "html": "<div class=\"tabs cols c46\" data-start=\"ml\">\n<div style=\"display:flex;align-items:center;justify-content:center\">\n<svg viewBox=\"0 0 520 520\" width=\"500\" height=\"500\" style=\"cursor:pointer\">\n<g data-t=\"ai\"><circle cx=\"260\" cy=\"260\" r=\"250\" fill=\"#e6eefb\" stroke=\"#2f6fd0\" stroke-width=\"3\"/><text x=\"260\" y=\"60\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\" fill=\"#2f6fd0\" font-family=\"Inter\">Artificial Intelligence<\/text><\/g>\n<g data-t=\"ml\"><circle cx=\"260\" cy=\"290\" r=\"190\" fill=\"#e3f4f2\" stroke=\"#0f8b80\" stroke-width=\"3\"/><text x=\"260\" y=\"140\" text-anchor=\"middle\" font-size=\"25\" font-weight=\"800\" fill=\"#0f8b80\" font-family=\"Inter\">Machine Learning<\/text><\/g>\n<g data-t=\"dl\"><circle cx=\"260\" cy=\"320\" r=\"130\" fill=\"#efebfb\" stroke=\"#6a4fc8\" stroke-width=\"3\"/><text x=\"260\" y=\"232\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"#6a4fc8\" font-family=\"Inter\">Deep Learning<\/text><\/g>\n<g data-t=\"gen\"><circle cx=\"260\" cy=\"350\" r=\"72\" fill=\"#fbe9e4\" stroke=\"#d9573b\" stroke-width=\"3\"/><text x=\"260\" y=\"345\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"800\" fill=\"#d9573b\" font-family=\"Inter\">Generative<\/text><text x=\"260\" y=\"372\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"800\" fill=\"#d9573b\" font-family=\"Inter\">AI<\/text><\/g>\n<\/svg><\/div>\n<div>\n<p class=\"xs muted\" style=\"margin-top:0\">Click a circle to explore each layer.<\/p>\n<div class=\"tab-panel card bl\" data-t=\"ai\"><h3>Artificial intelligence<\/h3><p class=\"sm\">The whole field: any technique that makes computers behave intelligently. It includes rule-based systems (a chess engine searching moves, a tax rules engine) and everything that learns.<\/p><p class=\"sm\"><b>Examples:<\/b> route planning in a GPS, a game AI that follows scripted rules, an expert system.<\/p><\/div>\n<div class=\"tab-panel card t\" data-t=\"ml\"><h3>Machine learning<\/h3><p class=\"sm\">AI systems that learn patterns from data. Classic ML methods include linear and logistic regression, decision trees, random forests, k-nearest neighbours and clustering. They excel on tables of data such as spreadsheets and databases.<\/p><p class=\"sm\"><b>Examples:<\/b> credit card fraud detection, house price estimates, customer segmentation, our EarlyCheck screener.<\/p><\/div>\n<div class=\"tab-panel card v\" data-t=\"dl\"><h3>Deep learning<\/h3><p class=\"sm\">Machine learning with <b>neural networks<\/b> that have many layers. Each layer learns slightly more abstract patterns (edges → shapes → faces). Deep learning needs lots of data and computing power and shines on images, sound and text.<\/p><p class=\"sm\"><b>Examples:<\/b> face unlock, speech recognition, medical image analysis, self-driving perception.<\/p><\/div>\n<div class=\"tab-panel card c\" data-t=\"gen\"><h3>Generative AI<\/h3><p class=\"sm\">Deep learning models that <b>create new content<\/b> — text, images, audio, code — instead of only predicting a label or number. Large language models (LLMs) such as ChatGPT, Claude and Gemini are generative AI for text.<\/p><p class=\"sm\"><b>Examples:<\/b> chatbots, image generators, code assistants, music generators.<\/p><\/div>\n<div class=\"callout sm\">Each circle sits <b>inside<\/b> the one around it: all generative AI is deep learning, all deep learning is machine learning, and all machine learning is AI — but not the other way round.<\/div>\n<\/div><\/div>"}, {"sec": "s1", "title": "Where ChatGPT and Claude fit: language models are ML models", "menu": "Generative AI and LLMs", "time": "6 min", "clock": "6:30", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li>A <b>large language model (LLM)<\/b> is a deep neural network trained on a huge amount of text. ChatGPT, Claude and Gemini are all LLMs.<\/li>\n<li>Its core skill is surprisingly simple: given some text, it predicts the <b>next token<\/b> (a word or a piece of a word). It outputs a probability for every possible next token.<\/li>\n<li>To write a whole answer, the model picks a token, adds it to the text, and predicts again — one token at a time.<\/li>\n<li>LLMs are built from the same ingredients we learn in this course: <b>data<\/b>, a <b>model with parameters<\/b> (billions of them), a <b>loss<\/b> that measures wrong predictions, and an algorithm that adjusts the parameters to reduce the loss.<\/li>\n<li>After this first stage, models are further trained with human feedback so they follow instructions and behave helpfully and safely.<\/li>\n<\/ul>\n<\/div>\n<div id=\"ntdemo\" class=\"wbox\">\n<div class=\"sm muted\" style=\"margin-bottom:6px\">Next-token prediction (illustrative probabilities)<\/div>\n<div class=\"ctx lg\" style=\"font-weight:600;color:var(--navy);min-height:110px;line-height:1.35\"><\/div>\n<div class=\"bars\" style=\"margin:10px 0\"><\/div>\n<div style=\"display:flex;gap:10px;align-items:center\"><button class=\"btn teal ntnext\">Pick the top token ▶<\/button><button class=\"btn ghost sm ntreset\">Restart<\/button><span class=\"ntstep xs muted\"><\/span><\/div>\n<div class=\"callout xs\" style=\"margin-top:12px\">An LLM does not look answers up in a database. It generates text by repeatedly choosing likely next tokens based on patterns learned during training — which is also why it can sound confident and still be wrong.<\/div>\n<\/div><\/div>"}, {"sec": "s1", "title": "Software 1.0 vs. Software 2.0: rules vs. learned programs", "menu": "Software 1.0 vs 2.0", "time": "6 min", "clock": "6:35", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li><b>Software 1.0<\/b> is classic code: a programmer writes explicit instructions such as <code>if \"free\" in email: mark_as_spam()<\/code>. Every behaviour is designed by a human.<\/li>\n<li><b>Software 2.0<\/b> (a term from Andrej Karpathy, 2017) is a program whose behaviour is <b>learned from data<\/b>. The programmer chooses the model and collects examples; training fills in millions of numbers (the weights).<\/li>\n<li>Rules are transparent and predictable, but they are brittle: they fail on cases nobody anticipated and are hard to maintain as the world changes.<\/li>\n<li>Learned programs adapt to messy, real-world patterns, but they need good data, they can be harder to explain, and they can quietly learn biases hidden in the data.<\/li>\n<\/ul>\n<div class=\"callout gold sm\"><b>Rule of thumb:<\/b> if you can write the rules down clearly and they rarely change (tax brackets, a thermostat), use Software 1.0. If the pattern is too complex to describe (spam, faces, speech), use machine learning.<\/div>\n<\/div>\n<div id=\"spamdemo\" class=\"wbox\">\n<div class=\"sm\" style=\"font-weight:700;color:var(--navy);margin-bottom:6px\">Try it: type an email subject line<\/div>\n<input class=\"msg\" value=\"Congratulations WINNER! Claim your free prize now!!!\">\n<div style=\"margin:8px 0\"><span class=\"chip\">Lecture notes attached for tomorrow<\/span><span class=\"chip\">Fr3e g1ft card — verify your account now<\/span><span class=\"chip\">Lunch with the team on Friday?<\/span><span class=\"chip\">URGENT: your password expires, click here<\/span><\/div>\n<div class=\"cols c2\" style=\"gap:14px;margin-top:8px\">\n<div class=\"card c\"><div class=\"xs\" style=\"font-weight:700\">SOFTWARE 1.0 · 4 hand-written rules<\/div><div id=\"r1\"><\/div><\/div>\n<div class=\"card t\"><div class=\"xs\" style=\"font-weight:700\">SOFTWARE 2.0 · learned word weights<\/div><div id=\"r2\"><\/div><\/div>\n<\/div>\n<p class=\"xs muted\" style=\"margin:8px 0 0\">The learned weights here are illustrative; a real filter learns thousands of them from labelled emails.<\/p>\n<\/div><\/div>"}, {"sec": "s1", "title": "Where classic machine learning still dominates", "menu": "Classic ML in industry + misconceptions", "time": "5 min", "clock": "6:40", "html": "<div class=\"cols c2\">\n<div>\n<p class=\"sm\">Generative AI gets the headlines, but most machine learning that runs businesses every day is <b>classic ML on tabular data<\/b> — rows and columns in spreadsheets and databases.<\/p>\n<div class=\"cols c2\" style=\"gap:12px\">\n<div class=\"card\"><b>📊 Tabular prediction<\/b><p class=\"xs\" style=\"margin:4px 0 0\">Credit scoring, insurance pricing, hospital readmission risk and customer churn are usually solved with regression, decision trees and ensembles such as random forests and gradient boosting.<\/p><\/div>\n<div class=\"card\"><b>📈 Forecasting<\/b><p class=\"xs\" style=\"margin:4px 0 0\">Predicting next month's sales, electricity demand or inventory needs from past numbers.<\/p><\/div>\n<div class=\"card\"><b>🛡️ Fraud detection<\/b><p class=\"xs\" style=\"margin:4px 0 0\">Banks score every card transaction in milliseconds and flag unusual ones for review.<\/p><\/div>\n<div class=\"card\"><b>🎬 Recommendations<\/b><p class=\"xs\" style=\"margin:4px 0 0\">Netflix, Spotify and online shops suggest items based on the behaviour of similar users.<\/p><\/div>\n<\/div>\n<p class=\"xs muted\" style=\"margin-top:10px\">Why? Classic models are fast, cheap, accurate on tables, and easier to explain to managers and regulators.<\/p>\n<\/div>\n<div>\n<h3 style=\"margin:0 0 10px;color:var(--navy)\">Three misconceptions to leave behind tonight<\/h3>\n<div class=\"card c\" style=\"margin-bottom:10px\"><b>✗ “AI understands like a human.”<\/b><p class=\"xs\" style=\"margin:4px 0 0\">✓ A model optimises a loss on data — nothing more, nothing less. It finds statistical patterns; it has no understanding, intentions or common sense.<\/p><\/div>\n<div class=\"card c\" style=\"margin-bottom:10px\"><b>✗ “A more complex model is always better.”<\/b><p class=\"xs\" style=\"margin:4px 0 0\">✓ Always start with a simple <b>baseline<\/b>. A complex model is only worth it if it clearly beats the simple one on new data.<\/p><\/div>\n<div class=\"card c\"><b>✗ “LLMs replaced classical ML.”<\/b><p class=\"xs\" style=\"margin:4px 0 0\">✓ Most business ML on tables still uses regression, trees and ensembles. LLMs are a powerful addition, not a replacement.<\/p><\/div>\n<\/div><\/div>"}, {"sec": "s1", "kicker": "Activity 1", "title": "“Is it ML?” card sort", "menu": "Activity 1: Is it ML?", "time": "8 min", "clock": "6:44", "tag": "Pairs · 5 min", "html": "<div class=\"act-head\"><span class=\"sm\">For each scenario, decide with your partner: does it <b>learn patterns from data<\/b> (ML) or <b>follow fixed rules<\/b> (not ML)? Then click a card to check.<\/span><span class=\"timer\" data-min=\"5\"><\/span><button class=\"btn ghost sm flip-all\">Reveal all answers<\/button><\/div>\n<div class=\"flipgrid\">\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Email spam filter<small>Gmail moves junk to spam<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>Learns which words, senders and patterns signal spam from millions of labelled emails, and keeps updating as spammers change.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Thermostat rule<small>Heat on below 20 °C<\/small><\/div><div class=\"bk no\"><b>✗ Not ML<\/b>A single fixed if-then rule written by a person. It never learns from data.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Netflix recommendations<small>“Because you watched…”<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>Learns your tastes from your viewing history and the behaviour of millions of similar users.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Calculator<small>12 × 7 = 84<\/small><\/div><div class=\"bk no\"><b>✗ Not ML<\/b>Exact arithmetic rules. The answer is always the same and nothing is learned.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Fraud alert<small>Bank texts about a strange purchase<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>A model scores each transaction against patterns learned from past fraud and normal spending. (Banks often add rules on top.)<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">ChatGPT<small>Answers questions in text<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>A large language model — deep learning trained on huge amounts of text to predict the next token.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Self-checkout scale<small>“Unexpected item in bagging area”<\/small><\/div><div class=\"bk no\"><b>✗ Not ML (usually)<\/b>Compares the measured weight with the expected weight of the scanned item, within a tolerance: a fixed rule.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">House price estimate<small>Online home value tool<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>Regression learned from past sales: size, location, bedrooms and so on → a price.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Customer segments<small>Grouping shoppers by behaviour<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>Unsupervised clustering finds groups of similar customers without any labels.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Face unlock<small>Phone recognises your face<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>A deep neural network learned to turn faces into numbers it can compare.<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Tax rules engine<small>Calculates tax owed<\/small><\/div><div class=\"bk no\"><b>✗ Not ML<\/b>Encodes the tax law as explicit rules. You would not want it to “learn” its own tax rates!<\/div><\/div><\/div>\n<div class=\"flip\"><div class=\"in\"><div class=\"fr\">Music genre tagger<small>Labels songs as jazz, rock…<\/small><\/div><div class=\"bk yes\"><b>✓ ML<\/b>A classifier learned from audio of songs that were already labelled with genres.<\/div><\/div><\/div>\n<\/div>\n<div style=\"margin-top:10px\"><button class=\"btn sm reveal-btn\">Show solution summary<\/button><div class=\"solution xs\"><b>Solution:<\/b> ML = spam filter, Netflix, fraud alert, ChatGPT, house price, customer segments, face unlock, genre tagger (8). Not ML = thermostat, calculator, self-checkout scale, tax engine (4). <b>Test question:<\/b> “If we gave it more examples, would it get better?” If yes, it is ML.<\/div><\/div>"}, {"sec": "s2", "title": "Supervised learning: learning from labelled examples", "menu": "Supervised learning", "time": "5 min", "clock": "6:52", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li>In <b>supervised learning<\/b>, every training example comes with the <b>correct answer<\/b>, called the <b>label<\/b> (or target). The data “supervises” the model, like a teacher marking homework.<\/li>\n<li>The model learns a mapping from inputs (<b>features<\/b>, usually written <b>x<\/b>) to the output (<b>label<\/b>, written <b>y<\/b>). After training, it predicts the label for new examples it has never seen.<\/li>\n<li>Supervised learning has two main families, decided by <b>what kind of answer<\/b> we want:<\/li>\n<\/ul>\n<div class=\"cols c2\" style=\"gap:14px;margin-top:6px\">\n<div class=\"card bl\"><h3>Regression<\/h3><p class=\"xs\" style=\"margin:0\">Predicts a <b>number<\/b> on a continuous scale: a price, a temperature, a BMI value, minutes until a bus arrives.<\/p><\/div>\n<div class=\"card c\"><h3>Classification<\/h3><p class=\"xs\" style=\"margin:0\">Predicts a <b>category<\/b> from a fixed set: spam or not spam, diabetes risk yes or no, cat / dog / bird.<\/p><\/div>\n<\/div>\n<div class=\"callout sm\">Supervised learning is the most widely used kind of ML in industry, and it is the focus of Weeks 1–4 and most of our EarlyCheck project.<\/div>\n<\/div>\n<div>\n<svg viewBox=\"0 0 620 470\" width=\"100%\">\n<defs><marker id=\"a2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#14294a\"/><\/marker><\/defs>\n<text x=\"10\" y=\"26\" font-size=\"19\" font-weight=\"800\" fill=\"#2f6fd0\" font-family=\"Inter\">1 · TRAINING (with answers)<\/text>\n<rect x=\"10\" y=\"40\" width=\"250\" height=\"170\" rx=\"12\" fill=\"#f7f9fc\" stroke=\"#dfe4ec\"/>\n<g font-family=\"JetBrains Mono, monospace\" font-size=\"16\"><text x=\"26\" y=\"70\" fill=\"#2f6fd0\">x: 3 bed, 120 m²<\/text><text x=\"196\" y=\"70\" fill=\"#d9573b\">$540k<\/text>\n<text x=\"26\" y=\"104\" fill=\"#2f6fd0\">x: 2 bed,  80 m²<\/text><text x=\"196\" y=\"104\" fill=\"#d9573b\">$410k<\/text>\n<text x=\"26\" y=\"138\" fill=\"#2f6fd0\">x: 4 bed, 190 m²<\/text><text x=\"196\" y=\"138\" fill=\"#d9573b\">$780k<\/text>\n<text x=\"26\" y=\"172\" fill=\"#2f6fd0\">x: …<\/text><text x=\"196\" y=\"172\" fill=\"#d9573b\">y: …<\/text><\/g>\n<path d=\"M262 125 L340 125\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#a2)\"/>\n<rect x=\"345\" y=\"85\" width=\"140\" height=\"80\" rx=\"14\" fill=\"#14294a\"/><text x=\"415\" y=\"120\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"20\" font-weight=\"700\" font-family=\"Inter\">Learning<\/text><text x=\"415\" y=\"145\" text-anchor=\"middle\" fill=\"#9fb4d3\" font-size=\"15\" font-family=\"Inter\">algorithm<\/text>\n<path d=\"M415 167 L415 260\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#a2)\"/>\n<text x=\"10\" y=\"270\" font-size=\"19\" font-weight=\"800\" fill=\"#0f8b80\" font-family=\"Inter\">2 · PREDICTION (new data)<\/text>\n<rect x=\"10\" y=\"290\" width=\"250\" height=\"70\" rx=\"12\" fill=\"#e6eefb\" stroke=\"#2f6fd0\"/><text x=\"135\" y=\"332\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"17\" fill=\"#2f6fd0\">x: 3 bed, 140 m²<\/text>\n<path d=\"M262 325 L340 325\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#a2)\"/>\n<rect x=\"345\" y=\"265\" width=\"140\" height=\"120\" rx=\"14\" fill=\"#0f8b80\"/><text x=\"415\" y=\"320\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"21\" font-weight=\"800\" font-family=\"Inter\">Trained<\/text><text x=\"415\" y=\"346\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"21\" font-weight=\"800\" font-family=\"Inter\">model<\/text>\n<path d=\"M487 325 L540 325\" stroke=\"#14294a\" stroke-width=\"3\" marker-end=\"url(#a2)\"/>\n<text x=\"580\" y=\"318\" text-anchor=\"middle\" font-size=\"22\" font-weight=\"800\" fill=\"#d9573b\" font-family=\"Inter\">ŷ ≈<\/text><text x=\"580\" y=\"345\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"800\" fill=\"#d9573b\" font-family=\"Inter\">$590k<\/text>\n<text x=\"10\" y=\"440\" font-size=\"16\" fill=\"#5b6678\" font-family=\"Inter\">ŷ (“y-hat”) is the model's prediction; y is the true label.<\/text>\n<\/svg>\n<\/div><\/div>"}, {"sec": "s2", "title": "Regression vs. classification: number or category?", "menu": "Regression vs classification", "time": "6 min", "clock": "6:57", "html": "<div class=\"cols c2\">\n<div>\n<table class=\"t sm\">\n<tr><th><\/th><th>Regression<\/th><th>Classification<\/th><\/tr>\n<tr><td><b>Output<\/b><\/td><td>A number on a continuous scale<\/td><td>A category (class) from a fixed set<\/td><\/tr>\n<tr><td><b>Question<\/b><\/td><td>“How much?” or “How many?”<\/td><td>“Which one?” or “Yes or no?”<\/td><\/tr>\n<tr><td><b>Examples<\/b><\/td><td>House price, temperature, BMI, delivery time<\/td><td>Spam/not spam, disease yes/no, digit 0–9<\/td><\/tr>\n<tr><td><b>Typical models<\/b><\/td><td>Linear regression (Week 2)<\/td><td>Logistic regression, KNN, trees (Weeks 3–4)<\/td><\/tr>\n<tr><td><b>Typical metrics<\/b><\/td><td>MAE, RMSE, R²<\/td><td>Accuracy, precision, recall, F1<\/td><\/tr>\n<\/table>\n<div class=\"callout warn xs\"><b>Watch out:<\/b> a number is not always a regression target. Postal codes, jersey numbers and the digits 0–9 in handwriting are <b>labels<\/b>, not amounts — averaging them makes no sense. Ask: “Is 4 more than 3 in a meaningful way here?”<\/div>\n<p class=\"xs muted\">Classification with two classes is <b>binary<\/b>; with three or more it is <b>multi-class<\/b>.<\/p>\n<\/div>\n<div class=\"sorter wbox\" data-items='[[\"Predict tomorrow&#39;s maximum temperature in Vancouver\", \"Regression\", \"the answer is a number of degrees.\"], [\"Decide whether a credit card transaction is fraudulent\", \"Classification\", \"two categories: fraud or not fraud.\"], [\"Estimate a person&#39;s BMI from lifestyle survey answers\", \"Regression\", \"BMI is a continuous number \\u2014 EarlyCheck&#39;s first question.\"], [\"Flag whether a person is likely to have diabetes or prediabetes\", \"Classification\", \"yes / no \\u2014 EarlyCheck&#39;s main question.\"], [\"Recognise which digit (0\\u20139) is written in an image\", \"Classification\", \"ten categories; the digits are labels, not amounts.\"], [\"Predict how many minutes until the next bus arrives\", \"Regression\", \"minutes are a quantity on a continuous scale.\"], [\"Sort customer emails into billing, technical or sales\", \"Classification\", \"three categories (multi-class classification).\"], [\"Estimate the sale price of a used car\", \"Regression\", \"a price in dollars.\"]]'>\n<div class=\"sm\" style=\"font-weight:700;color:var(--navy)\">Quick-fire game: regression or classification?<\/div>\n<div class=\"sscore xs muted\" style=\"margin:4px 0 10px\"><\/div>\n<div class=\"sq lg\" style=\"font-weight:700;color:var(--navy);min-height:110px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px\"><\/div>\n<div style=\"display:flex;gap:10px;margin:14px 0\"><button class=\"btn sbtn\" data-v=\"Regression\" style=\"background:var(--blue);flex:1\">Regression<\/button><button class=\"btn sbtn\" data-v=\"Classification\" style=\"background:var(--coral);flex:1\">Classification<\/button><\/div>\n<div class=\"fb sm\"><\/div>\n<button class=\"btn ghost sm snext\" style=\"margin-top:8px\">Next scenario ▶<\/button>\n<\/div><\/div>"}, {"sec": "s2", "title": "Unsupervised learning: finding structure without labels", "menu": "Unsupervised learning", "time": "6 min", "clock": "7:02", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li>In <b>unsupervised learning<\/b> the data has <b>no labels<\/b>. Nobody tells the model the right answer; its job is to discover structure that is already hidden in the data.<\/li>\n<li><b>Clustering<\/b> groups similar examples together. A shop might discover “bargain hunters”, “weekend families” and “luxury buyers” without anyone defining those groups in advance. In Week 5 we will find health profiles in the EarlyCheck data.<\/li>\n<li><b>Dimensionality reduction<\/b> squeezes many columns into a few new ones while keeping as much information as possible. It lets us draw a 21-column dataset as a 2-D picture and can speed up other models. The best-known method is <b>PCA<\/b> (principal component analysis).<\/li>\n<li>Because there is no “correct answer”, judging unsupervised results is harder: we check whether the groups are compact, well separated and <b>useful to people<\/b>.<\/li>\n<\/ul>\n<\/div>\n<div class=\"wbox\">\n<div class=\"sm\" style=\"font-weight:700;color:var(--navy)\">Demo: k-means clustering, step by step<\/div>\n<canvas id=\"clustercv\" width=\"640\" height=\"380\" style=\"width:100%;border-radius:10px;margin:8px 0\"><\/canvas>\n<div id=\"clusterstep\" class=\"xs muted\" style=\"min-height:44px\">No labels — just dots. Can the computer find groups on its own?<\/div>\n<div style=\"display:flex;gap:10px;margin-top:6px\"><button class=\"btn teal\" id=\"clusterbtn\">Next step ▶<\/button><button class=\"btn ghost sm\" id=\"clusterreset\">Reset<\/button><\/div>\n<\/div><\/div>"}, {"sec": "s2", "title": "Self-supervised learning: how language models learn", "menu": "Self-supervised learning", "time": "5 min", "clock": "7:07", "tag": "Overview only", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li><b>Self-supervised learning<\/b> creates labels <b>automatically from the data itself<\/b>, so no human has to label anything. Part of the input is hidden, and the model learns to predict the hidden part.<\/li>\n<li>This is how LLMs are <b>pre-trained<\/b>: every piece of text on the internet becomes millions of free training examples of the form “given these words, what comes next?”<\/li>\n<li>Technically it is still supervised learning (there is a correct answer for every example), but the supervision comes for free, which is why models can learn from trillions of words.<\/li>\n<li>The same trick works for images (hide a patch and predict it) and audio (predict the next sound).<\/li>\n<\/ul>\n<div class=\"callout sm\">Self-supervised pre-training is the reason modern LLMs became possible: labelled data is expensive, but raw text is almost unlimited.<\/div>\n<\/div>\n<div>\n<div class=\"card\" style=\"background:#fff\">\n<div class=\"xs\" style=\"font-weight:700;color:var(--muted);margin-bottom:6px\">ONE SENTENCE → FOUR FREE TRAINING EXAMPLES<\/div>\n<div class=\"sm\" style=\"font-family:var(--mono);background:#f7f9fc;border-radius:10px;padding:10px 14px;margin-bottom:12px\">“Regular exercise lowers the risk of diabetes.”<\/div>\n<table class=\"t\">\n<tr><th class=\"feat\">Input (features)<\/th><th class=\"lab\">Label (next word)<\/th><\/tr>\n<tr><td>Regular<\/td><td><b>exercise<\/b><\/td><\/tr>\n<tr><td>Regular exercise<\/td><td><b>lowers<\/b><\/td><\/tr>\n<tr><td>Regular exercise lowers the<\/td><td><b>risk<\/b><\/td><\/tr>\n<tr><td>Regular exercise lowers the risk of<\/td><td><b>diabetes<\/b><\/td><\/tr>\n<\/table>\n<p class=\"xs muted\" style=\"margin:10px 0 0\">No one labelled anything — the text labelled itself. In Week 8 we build a tiny model that learns names letter by letter in exactly this way.<\/p>\n<\/div><\/div><\/div>"}, {"sec": "s2", "title": "Reinforcement learning: learning by trial and reward", "menu": "Reinforcement learning", "time": "4 min", "clock": "7:11", "tag": "Overview only", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li>In <b>reinforcement learning (RL)<\/b>, an <b>agent<\/b> learns by <b>acting<\/b> in an <b>environment<\/b> and receiving <b>rewards<\/b> or penalties. There is no table of correct answers — only feedback on how good each outcome was.<\/li>\n<li>The agent's goal is to learn a <b>policy<\/b> (a strategy for choosing actions) that collects the most reward over time, even if some rewards arrive much later.<\/li>\n<li><b>Examples:<\/b> game-playing systems such as DeepMind's AlphaGo, robots learning to walk or grasp, and tuning traffic lights or data-centre cooling.<\/li>\n<li>RL is also used to fine-tune chatbots: in <b>reinforcement learning from human feedback (RLHF)<\/b>, people rate answers and the model is rewarded for the kinds of answers people prefer.<\/li>\n<\/ul>\n<div class=\"callout gold xs\">We will not build RL models in this course, but you should be able to recognise an RL problem: <b>actions → feedback → better actions<\/b>.<\/div>\n<\/div>\n<div style=\"display:flex;align-items:center;justify-content:center\">\n<svg viewBox=\"0 0 560 420\" width=\"100%\">\n<defs><marker id=\"a3\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#14294a\"/><\/marker><\/defs>\n<rect x=\"190\" y=\"20\" width=\"180\" height=\"90\" rx=\"16\" fill=\"#2f6fd0\"/><text x=\"280\" y=\"62\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"26\" font-weight=\"800\" font-family=\"Inter\">Agent<\/text><text x=\"280\" y=\"90\" text-anchor=\"middle\" fill=\"#dce8fb\" font-size=\"16\" font-family=\"Inter\">(the learner)<\/text>\n<rect x=\"160\" y=\"300\" width=\"240\" height=\"90\" rx=\"16\" fill=\"#0f8b80\"/><text x=\"280\" y=\"342\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"26\" font-weight=\"800\" font-family=\"Inter\">Environment<\/text><text x=\"280\" y=\"370\" text-anchor=\"middle\" fill=\"#d7f1ee\" font-size=\"16\" font-family=\"Inter\">(game, robot's world, users)<\/text>\n<path d=\"M375 70 C 520 90, 520 300, 405 335\" stroke=\"#14294a\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#a3)\"/>\n<text x=\"470\" y=\"200\" font-size=\"20\" font-weight=\"800\" fill=\"#14294a\" font-family=\"Inter\">Action<\/text>\n<path d=\"M155 345 C 30 320, 30 100, 185 70\" stroke=\"#d9573b\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#a3)\"/>\n<text x=\"6\" y=\"190\" font-size=\"20\" font-weight=\"800\" fill=\"#d9573b\" font-family=\"Inter\">Reward<\/text><text x=\"6\" y=\"216\" font-size=\"20\" font-weight=\"800\" fill=\"#d9573b\" font-family=\"Inter\">+ new state<\/text>\n<\/svg><\/div><\/div>"}, {"sec": "s2", "kicker": "Activity 2", "title": "Name the learning type", "menu": "Activity 2: Name the learning type", "time": "5 min", "clock": "7:15", "tag": "Individual · 4 min", "html": "<div data-quiz>\n<div class=\"act-head\"><span class=\"sm\">Choose the type of machine learning for each scenario. Each question shows the correct answer and a short explanation after you click.<\/span><span class=\"timer\" data-min=\"4\"><\/span><\/div>\n<div class=\"cols c2\" style=\"gap:10px 28px\"><div class=\"q\"><div class=\"qt\">1. A bank predicts the dollar amount a customer will spend next month.<\/div><div class=\"opts\"><button class=\"opt\" data-c=\"1\">Supervised: regression<\/button><button class=\"opt\" data-c=\"0\">Supervised: classification<\/button><button class=\"opt\" data-c=\"0\">Unsupervised<\/button><button class=\"opt\" data-c=\"0\">Self-supervised<\/button><button class=\"opt\" data-c=\"0\">Reinforcement<\/button><\/div><div class=\"why\">A number on a continuous scale with past spending as labels → regression.<\/div><\/div><div class=\"q\"><div class=\"qt\">2. A hospital groups patients into profiles from their records, with no diagnosis column.<\/div><div class=\"opts\"><button class=\"opt\" data-c=\"0\">Supervised: regression<\/button><button class=\"opt\" data-c=\"0\">Supervised: classification<\/button><button class=\"opt\" data-c=\"1\">Unsupervised<\/button><button class=\"opt\" data-c=\"0\">Self-supervised<\/button><button class=\"opt\" data-c=\"0\">Reinforcement<\/button><\/div><div class=\"why\">No labels; the goal is to find natural groups → unsupervised clustering.<\/div><\/div><div class=\"q\"><div class=\"qt\">3. A robot vacuum improves its cleaning path by getting points for covering new floor.<\/div><div class=\"opts\"><button class=\"opt\" data-c=\"0\">Supervised: regression<\/button><button class=\"opt\" data-c=\"0\">Supervised: classification<\/button><button class=\"opt\" data-c=\"0\">Unsupervised<\/button><button class=\"opt\" data-c=\"0\">Self-supervised<\/button><button class=\"opt\" data-c=\"1\">Reinforcement<\/button><\/div><div class=\"why\">Actions, environment and rewards → reinforcement learning.<\/div><\/div><div class=\"q\"><div class=\"qt\">4. A model reads millions of Wikipedia articles and learns to fill in the next word.<\/div><div class=\"opts\"><button class=\"opt\" data-c=\"0\">Supervised: regression<\/button><button class=\"opt\" data-c=\"0\">Supervised: classification<\/button><button class=\"opt\" data-c=\"0\">Unsupervised<\/button><button class=\"opt\" data-c=\"1\">Self-supervised<\/button><button class=\"opt\" data-c=\"0\">Reinforcement<\/button><\/div><div class=\"why\">The labels (next words) come from the text itself → self-supervised.<\/div><\/div><div class=\"q\"><div class=\"qt\">5. A clinic predicts whether a mole is benign or malignant from labelled photos.<\/div><div class=\"opts\"><button class=\"opt\" data-c=\"0\">Supervised: regression<\/button><button class=\"opt\" data-c=\"1\">Supervised: classification<\/button><button class=\"opt\" data-c=\"0\">Unsupervised<\/button><button class=\"opt\" data-c=\"0\">Self-supervised<\/button><button class=\"opt\" data-c=\"0\">Reinforcement<\/button><\/div><div class=\"why\">Two categories with expert labels → binary classification.<\/div><\/div><div class=\"q\"><div class=\"qt\">6. An online shop squeezes 300 product-behaviour columns into 2 to draw a map of customers.<\/div><div class=\"opts\"><button class=\"opt\" data-c=\"0\">Supervised: regression<\/button><button class=\"opt\" data-c=\"0\">Supervised: classification<\/button><button class=\"opt\" data-c=\"1\">Unsupervised<\/button><button class=\"opt\" data-c=\"0\">Self-supervised<\/button><button class=\"opt\" data-c=\"0\">Reinforcement<\/button><\/div><div class=\"why\">Dimensionality reduction (e.g. PCA) is unsupervised: there is no label.<\/div><\/div><\/div>\n<div style=\"display:flex;gap:12px;align-items:center;margin-top:4px\"><span class=\"score sm\"><\/span><button class=\"btn ghost sm quiz-all\">Show all answers<\/button><button class=\"btn ghost sm quiz-reset\">Reset<\/button><\/div>\n<\/div>"}, {"sec": "s3", "title": "The machine learning workflow: seven steps", "menu": "The ML workflow", "time": "6 min", "clock": "7:30", "html": "<div class=\"tabs\">\n<div class=\"steps\"><div class=\"st\" data-t=\"1\"><span class=\"num\">1<\/span>Frame<\/div><div class=\"st\" data-t=\"2\"><span class=\"num\">2<\/span>Collect<\/div><div class=\"st\" data-t=\"3\"><span class=\"num\">3<\/span>Prepare<\/div><div class=\"st\" data-t=\"4\"><span class=\"num\">4<\/span>Train<\/div><div class=\"st\" data-t=\"5\"><span class=\"num\">5<\/span>Evaluate<\/div><div class=\"st\" data-t=\"6\"><span class=\"num\">6<\/span>Deploy<\/div><div class=\"st\" data-t=\"7\"><span class=\"num\">7<\/span>Monitor<\/div><\/div>\n<div class=\"tab-panel\" data-t=\"1\"><div class=\"cols c2\"><div class=\"card\"><h3>1. Frame the problem<\/h3><p class=\"sm\" style=\"margin:0\">Decide the question, the users and what a useful answer looks like. Agree how success will be measured <b>before<\/b> touching data.<\/p><\/div><div class=\"card bl\"><h3>In EarlyCheck<\/h3><p class=\"sm\" style=\"margin:0\">Flag adults likely to have diabetes or prediabetes so they get a blood test. Success = catch most at-risk people (high recall).<\/p><\/div><\/div><\/div><div class=\"tab-panel\" data-t=\"2\"><div class=\"cols c2\"><div class=\"card\"><h3>2. Collect data<\/h3><p class=\"sm\" style=\"margin:0\">Find or gather examples that represent the people or things the model will see in real life. Check the source, licence and privacy.<\/p><\/div><div class=\"card bl\"><h3>In EarlyCheck<\/h3><p class=\"sm\" style=\"margin:0\">253,680 answers to the CDC's 2015 BRFSS telephone health survey (UCI dataset #891).<\/p><\/div><\/div><\/div><div class=\"tab-panel\" data-t=\"3\"><div class=\"cols c2\"><div class=\"card\"><h3>3. Prepare features<\/h3><p class=\"sm\" style=\"margin:0\">Clean the data, remove duplicates, handle missing values, encode categories and scale numbers. This usually takes most of the time on a real project.<\/p><\/div><div class=\"card bl\"><h3>In EarlyCheck<\/h3><p class=\"sm\" style=\"margin:0\">Remove duplicate rows, keep age and income as ordered codes, split into training and test sets (Week 2).<\/p><\/div><\/div><\/div><div class=\"tab-panel\" data-t=\"4\"><div class=\"cols c2\"><div class=\"card\"><h3>4. Train the model<\/h3><p class=\"sm\" style=\"margin:0\">Choose a model and let a learning algorithm adjust its parameters to reduce the loss on the training data.<\/p><\/div><div class=\"card bl\"><h3>In EarlyCheck<\/h3><p class=\"sm\" style=\"margin:0\">Logistic regression, trees and later a neural network learn which survey answers signal risk.<\/p><\/div><\/div><\/div><div class=\"tab-panel\" data-t=\"5\"><div class=\"cols c2\"><div class=\"card\"><h3>5. Evaluate<\/h3><p class=\"sm\" style=\"margin:0\">Test on data the model has <b>never seen<\/b> and compare with a simple baseline. Check errors for different groups of people.<\/p><\/div><div class=\"card bl\"><h3>In EarlyCheck<\/h3><p class=\"sm\" style=\"margin:0\">Compare recall with an always-“no” baseline; check fairness across income, age and sex groups.<\/p><\/div><\/div><\/div><div class=\"tab-panel\" data-t=\"6\"><div class=\"cols c2\"><div class=\"card\"><h3>6. Deploy<\/h3><p class=\"sm\" style=\"margin:0\">Put the model where people can use it: an app, a website, an API or a report.<\/p><\/div><div class=\"card bl\"><h3>In EarlyCheck<\/h3><p class=\"sm\" style=\"margin:0\">A Gradio web app that asks the health questions and shows a risk level with a “see a doctor” message (Week 9).<\/p><\/div><\/div><\/div><div class=\"tab-panel\" data-t=\"7\"><div class=\"cols c2\"><div class=\"card\"><h3>7. Monitor<\/h3><p class=\"sm\" style=\"margin:0\">Watch performance over time. The world changes (data drift), so models need checking and retraining.<\/p><\/div><div class=\"card bl\"><h3>In EarlyCheck<\/h3><p class=\"sm\" style=\"margin:0\">Survey answers from 2015 may not match people in 2026 or in Canada; re-check before any real use.<\/p><\/div><\/div><\/div>\n<\/div>\n<div class=\"cols c2\" style=\"margin-top:18px\">\n<div class=\"callout sm\" style=\"margin:0\">The workflow is a <b>loop, not a straight line<\/b>. Evaluation often sends you back to collect more data or prepare features differently, and monitoring eventually sends you back to retraining.<\/div>\n<div class=\"callout gold sm\" style=\"margin:0\">Data scientists often say that preparing data takes the majority of a project's time. Training the model is usually the shortest step.<\/div>\n<\/div>"}, {"sec": "s3", "title": "The vocabulary of ML: examples, features and labels", "menu": "Features, labels, examples", "time": "6 min", "clock": "7:35", "html": "<p class=\"sm\" style=\"margin-bottom:10px\">Below are a few rows laid out exactly like the EarlyCheck data (CDC Diabetes Health Indicators, 21 features + 1 label; values shown for illustration).<\/p>\n<table class=\"t mono\">\n<tr><th class=\"feat\">HighBP<\/th><th class=\"feat\">HighChol<\/th><th class=\"feat\">BMI<\/th><th class=\"feat\">Smoker<\/th><th class=\"feat\">PhysActivity<\/th><th class=\"feat\">GenHlth<\/th><th class=\"feat\">Age<\/th><th class=\"feat\">Income<\/th><th class=\"feat\">… 13 more<\/th><th class=\"lab\">Diabetes_binary<\/th><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>40<\/td><td>1<\/td><td>0<\/td><td>5<\/td><td>9<\/td><td>3<\/td><td>…<\/td><td><b>0<\/b><\/td><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>25<\/td><td>1<\/td><td>1<\/td><td>3<\/td><td>7<\/td><td>1<\/td><td>…<\/td><td><b>0<\/b><\/td><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>30<\/td><td>0<\/td><td>1<\/td><td>4<\/td><td>11<\/td><td>4<\/td><td>…<\/td><td><b>1<\/b><\/td><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>24<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>8<\/td><td>8<\/td><td>…<\/td><td><b>0<\/b><\/td><\/tr>\n<\/table>\n<div class=\"cols c3\" style=\"margin-top:16px;gap:18px\">\n<div class=\"card\"><h3>Example (row)<\/h3><p class=\"xs\" style=\"margin:0\">One observation — here, one person's survey answers. Also called a sample, instance or record. EarlyCheck has <b>253,680<\/b> examples.<\/p><\/div>\n<div class=\"card bl\"><h3 style=\"color:var(--blue)\">Features (x)<\/h3><p class=\"xs\" style=\"margin:0\">The input columns the model uses to make a prediction: blood pressure, BMI, activity, age group and so on. Also called predictors, attributes or variables.<\/p><\/div>\n<div class=\"card c\"><h3 style=\"color:var(--coral)\">Label (y)<\/h3><p class=\"xs\" style=\"margin:0\">The column we want to predict: <code>Diabetes_binary<\/code>, where 0 = no diabetes and 1 = prediabetes or diabetes. Also called the target or outcome.<\/p><\/div>\n<\/div>\n<p class=\"xs muted\" style=\"margin-top:12px\">Codes: GenHlth 1 = excellent … 5 = poor; Age is 13 groups (1 = 18–24 … 13 = 80+); Income is 8 groups (1 = lowest … 8 = highest). Binary columns use 1 = yes, 0 = no.<\/p>"}, {"sec": "s3", "title": "Model, parameters, prediction and loss", "menu": "Model, parameters, prediction, loss", "time": "7 min", "clock": "7:40", "html": "<div class=\"cols c2\">\n<div>\n<div class=\"card\" style=\"background:#0f1b2d;color:#fff;text-align:center;padding:18px\"><div style=\"font-family:var(--mono);font-size:44px;font-weight:700\">ŷ = <span style=\"color:#8cc8ff\">w<\/span> · x + <span style=\"color:#ffd38a\">b<\/span><\/div><div class=\"xs\" style=\"color:#b9c8de;margin-top:6px\">our first model: a straight line<\/div><\/div>\n<ul class=\"b sm\" style=\"margin-top:14px\">\n<li>A <b>model<\/b> is a function that turns features into a prediction. Its shape (here, a straight line) is chosen by us.<\/li>\n<li><b>Parameters<\/b> are the adjustable knobs inside the model. Here there are two: the slope <b style=\"color:var(--blue)\">w<\/b> (weight) and the intercept <b style=\"color:var(--amber)\">b<\/b> (bias). Training finds their values.<\/li>\n<li>A <b>prediction<\/b> (ŷ) is what the model outputs for one example. The <b>error<\/b> is the gap between the prediction and the true label: y − ŷ.<\/li>\n<li>The <b>loss<\/b> is one number that summarises how wrong the model is across all examples. Lower is better. <b>Training = finding the parameters that minimise the loss.<\/b><\/li>\n<\/ul>\n<\/div>\n<div>\n<div class=\"card\" style=\"background:#fff\">\n<h3>Mean squared error (MSE): a worked example<\/h3>\n<p class=\"xs\" style=\"margin:0 0 8px\">Model: ŷ = 4·x + 48, where x = hours studied and y = exam score.<\/p>\n<table class=\"t\">\n<tr><th>Hours x<\/th><th>True y<\/th><th>Predicted ŷ<\/th><th>Error y − ŷ<\/th><th>Error²<\/th><\/tr>\n<tr><td>2<\/td><td>55<\/td><td>4·2+48 = 56<\/td><td>−1<\/td><td>1<\/td><\/tr>\n<tr><td>5<\/td><td>68<\/td><td>4·5+48 = 68<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td>9<\/td><td>83<\/td><td>4·9+48 = 84<\/td><td>−1<\/td><td>1<\/td><\/tr>\n<\/table>\n<p class=\"sm\" style=\"margin:10px 0 0\"><b>MSE<\/b> = average of the squared errors = (1 + 0 + 1) ÷ 3 ≈ <b>0.67<\/b><\/p>\n<p class=\"xs muted\" style=\"margin:6px 0 0\">Squaring makes every error positive (so errors cannot cancel out) and punishes big mistakes more than small ones.<\/p>\n<\/div>\n<div class=\"callout gold sm\"><b>Model = function + parameters. Learning = minimising the loss.<\/b><\/div>\n<\/div><\/div>"}, {"sec": "s3", "kicker": "From Scratch", "title": "Guess the Line: be the learning algorithm", "menu": "From Scratch: Guess the Line", "time": "10 min", "clock": "7:46", "tag": "Class game", "html": "<div id=\"linegame\" class=\"cols c64\" style=\"gap:26px\">\n<div class=\"wbox\" style=\"padding:10px\"><canvas width=\"900\" height=\"660\" style=\"width:100%;display:block\"><\/canvas><\/div>\n<div>\n<p class=\"xs\" style=\"margin:0 0 10px\">Ten students: hours studied (x) vs. exam score (y). Move the two knobs to make the line fit the dots. Watch the loss.<\/p>\n<div class=\"card\" style=\"background:#fff;margin-bottom:10px\">\n<div class=\"sm\"><b style=\"color:var(--blue)\">w (slope)<\/b> = <span id=\"lwv\" style=\"font-family:var(--mono)\"><\/span><\/div><input id=\"lw\" type=\"range\" min=\"0\" max=\"8\" step=\"0.1\" value=\"1.5\">\n<div class=\"sm\" style=\"margin-top:8px\"><b style=\"color:var(--amber)\">b (intercept)<\/b> = <span id=\"lbv\" style=\"font-family:var(--mono)\"><\/span><\/div><input id=\"lb\" type=\"range\" min=\"30\" max=\"60\" step=\"0.5\" value=\"40\">\n<label class=\"xs\" style=\"display:block;margin-top:8px\"><input id=\"lresid\" type=\"checkbox\" checked> Show errors (red lines)<\/label>\n<\/div>\n<div class=\"card\" style=\"text-align:center;background:#fff\"><div class=\"xs muted\">Loss (mean squared error)<\/div><div class=\"big\" id=\"lmse\">—<\/div><\/div>\n<div style=\"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap\"><button class=\"btn teal\" id=\"lsubmit\">Submit my guess<\/button><button class=\"btn ghost sm\" id=\"lbest\">Reveal best line<\/button><\/div>\n<div id=\"lres\" class=\"sm\" style=\"margin-top:8px;min-height:30px\"><\/div>\n<div class=\"callout xs\" style=\"margin-top:6px\"><b>Strategy:<\/b> change one knob at a time, a little at a time, and keep the change only if the loss goes down. That is the idea behind gradient descent (Week 2).<\/div>\n<\/div><\/div>"}, {"sec": "s3", "title": "Baselines and the accuracy trap", "menu": "Baselines and the accuracy trap", "time": "6 min", "clock": "7:56", "html": "<div class=\"cols c2\">\n<div>\n<ul class=\"b sm\">\n<li>A <b>baseline<\/b> is the simplest possible “model”: always predict the average (regression) or always predict the most common class (classification). It needs no learning at all.<\/li>\n<li>A model is only useful if it <b>clearly beats the baseline<\/b> on data it has not seen. Always report the baseline next to your model's score.<\/li>\n<li><b>Accuracy<\/b> is the percentage of predictions that are correct. It sounds like the obvious score, but on <b>imbalanced<\/b> data it can be badly misleading.<\/li>\n<li>In the EarlyCheck data only about <b>14%<\/b> of people are labelled 1. A lazy model that always answers “no diabetes” is about <b>86% accurate<\/b> — while catching <b>zero<\/b> people who need a test.<\/li>\n<li><b>Recall<\/b> answers the question that matters for screening: of all the people who really are at risk, what fraction did we catch?<\/li>\n<\/ul>\n<\/div>\n<div id=\"trapdemo\" class=\"wbox\">\n<div class=\"sm\" style=\"font-weight:700;color:var(--navy)\">100 people · <span style=\"color:var(--coral)\">■ at risk<\/span> · <span style=\"color:#8a96aa\">■ not at risk<\/span><\/div>\n<div class=\"people\" style=\"margin:12px 0\"><\/div>\n<div class=\"sm\">Share of people at risk: <b id=\"tp\"><\/b><\/div>\n<input type=\"range\" min=\"1\" max=\"50\" value=\"14\">\n<div class=\"cols c2\" style=\"gap:12px;margin-top:10px\">\n<div class=\"card\" style=\"background:#fff;text-align:center\"><div class=\"xs muted\">“Always say NO” accuracy<\/div><div class=\"big\" id=\"tacc\" style=\"font-size:40px\"><\/div><\/div>\n<div c
